[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gspynext"
version = "0.1.0"
description = "GSpy Next contains python software for verification of space instruments."
readme = "README.rst"
authors = [
  {name = "GSpy IDA Team", email = "gspy@ida-team.de"}
]
maintainers = [
  {name = "GSpy IDA Team", email = "gspy@ida-team.de"}
]
classifiers = [

]
license = {text = "BSD license"}
dependencies = [
  "typer",
  "strictyaml>=1.3.0",
  "path>=16.0.0",
  "numpy>=1.21.0",
  "dill>=0.3.3"
]

[project.optional-dependencies]
dev = [
    "coverage",  # testing
    "mypy",  # linting
    "pytest",  # testing
    "ruff"  # linting
]

[project.urls]

bugs = "https://github.com/none/gspynext/issues"
changelog = "https://github.com/none/gspynext/blob/master/changelog.md"
homepage = "https://github.com/none/gspynext"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"*" = ["*.*"]




# Mypy
# ----

[tool.mypy]
files = "."

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

