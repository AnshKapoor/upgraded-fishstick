[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gpsy-egse"
version = "0.1.0"
description = "GSpy contains python software for verification of space instruments."
readme = "README.rst"
authors = [
  {name = "GSpy IDA Team", email = "gpsy-egse@ida-team.de"}
]
maintainers = [
  {name = "GSpy IDA Team", email = "gpsy-egse@ida-team.de"}
]
classifiers = [

]
license = {text = "BSD license"}
dependencies = [
  "typer",
  "strictyaml>=1.3.0",
  "path>=16.0.0",
  "numpy>=1.21.0",
  "dill>=0.3.3"
]

[project.optional-dependencies]
dev = [
    "coverage",  # testing
    "mypy",  # linting
    "pytest",  # testing
    "ruff"  # linting
]

gui = [
    "PyQt6>=6.6",           # pulls in PyQt6‑Qt6 and PyQt6‑sip automatically

    # 2‑D/3‑D real‑time plotting that works with PyQt6
    "pyqtgraph>=0.13",        # 0.13+ has full PyQt6 support
    # FontAwesome / Material‑style icons for Qt (QtPy‑based, Qt6‑ready)
    "qtawesome>=1.4.0"
]



[project.urls]

bugs = "https://github.com/none/gspynext/issues"
changelog = "https://github.com/none/gspynext/blob/master/changelog.md"
homepage = "https://github.com/none/gspynext"

[tool.setuptools]
package-dir = {"" = "src"}

# [project.optional-dependencies]
# gui = ["PySide6>=6.6"]

# --- entry‑points ---------------------------------------
[project.gui-scripts]           # Creates a clickable launcher on Windows/macOS
gspy-egse-gui = "gspy_egse.main:run"

# [project.scripts]               # (optional) CLI utilities
# gspy-egse-cli = "gspy_egse.cli:main"


# Mypy
# ----

[tool.mypy]
files = "."

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

